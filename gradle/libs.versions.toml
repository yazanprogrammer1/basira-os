# Pinned to versions already in the local Gradle cache (same set as the owner's other projects; slow network).
# Latest stable on 2026-11-24: AGP 9.5.2, Kotlin 2.4.21, KSP 2.3.14, Gradle 9.9.2, Compose BOM 2026.11.01,
# lifecycle 2.11.1, DataStore 1.3.0, MediaPipe tasks-vision 1.2.3. Bump when convenient.
[versions]
agp = "9.2.1"
kotlin = "2.4.20"
ksp = "2.3.12"
hilt = "2.60.1"
composeBom = "2026.09.00"
coroutines = "1.11.0"

androidxCore = "1.19.1"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
datastore = "1.2.1"
room = "2.8.5"

arcore = "1.57.0"

junit = "4.13.2"

# Android SDK levels (used by build-logic)
compileSdk = "37"
targetSdk = "37"
minSdk = "29"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

arcore = { group = "com.google.ar", name = "core", version.ref = "arcore" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

# build-logic only
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# AGP 9 compiles Kotlin itself (built-in Kotlin). Declaring KGP here only pins its version.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

# Convention plugins from build-logic
basira-android-application = { id = "basira.android.application" }
basira-android-library = { id = "basira.android.library" }
basira-android-compose = { id = "basira.android.compose" }
basira-hilt = { id = "basira.hilt" }
