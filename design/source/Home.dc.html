<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>بصيرة — الشاشة الرئيسية</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6EE7B7}a:hover{color:#A7F3D0}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #F4F7F5; background: #2B2F2D">
  <div aria-hidden="true" style="position: absolute; inset: 0 0 auto 0; height: 92px; background: #3A3833"></div>
  <div aria-hidden="true" style="position: absolute; top: 92px; left: 0; right: 0; height: 6px; background: #C9A35A; opacity: 0.55"></div>
  <div aria-hidden="true" style="position: absolute; top: 98px; left: 0; right: 0; height: 400px; background: #8E918C"></div>
  <div aria-hidden="true" style="position: absolute; top: 498px; left: 0; right: 0; bottom: 0; background: #A9ABA6"></div>
  <div aria-hidden="true" style="position: absolute; top: 230px; left: 70px; width: 150px; height: 268px; background: #3B2A22; border: 6px solid #2A1E18"></div>

  <!-- greeting -->
  <div style="position: absolute; top: 40px; left: 50%; transform: translateX(-50%); text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center">
    <div style="font-size: 30px; font-weight: 700; text-shadow: 0 2px 20px rgba(0,0,0,0.4)">مسا الخير يا يزن</div>
    <div style="font-size: 15px; color: #E6EDE9; text-shadow: 0 1px 10px rgba(0,0,0,0.5)">قول «يا بصيرة» أو اقرص على أي تطبيق</div>
  </div>

  <!-- app grid panel -->
  <div style="position: absolute; top: 130px; left: 50%; transform: translateX(-50%); width: 760px; padding: 28px 32px; box-sizing: border-box; border-radius: 34px; background: rgba(14,18,16,0.72); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(24px); display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 22px 12px">
    <sc-for list="{{apps}}" as="app" hint-placeholder-count="12">
      <button style="display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: 0; padding: 0; font-family: inherit; color: #F4F7F5; cursor: pointer">
        <span style="width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: {{app.bg}}; box-shadow: 0 8px 24px rgba(0,0,0,0.3); font-size: 26px; font-weight: 700; color: {{app.fg}}">{{app.glyph}}</span>
        <span style="font-size: 13px; font-weight: 500">{{app.name}}</span>
      </button>
    </sc-for>
  </div>

  <!-- spaces -->
  <div style="position: absolute; top: 470px; left: 50%; transform: translateX(-50%); width: 760px; display: flex; gap: 14px">
    <div style="flex: 1; padding: 16px 18px; border-radius: 22px; background: rgba(14,18,16,0.78); border: 1px solid rgba(255,255,255,0.12); display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 12px; color: #6EE7B7; font-weight: 600">مساحة محفوظة</div>
      <div style="font-size: 16px; font-weight: 600">غرفة الدراسة</div>
      <div style="font-size: 13px; color: #B8C4BE">٣ نوافذ رجعوا لمكانهم: المتصفح، الفيديو، المهام</div>
    </div>
    <div style="flex: 1; padding: 16px 18px; border-radius: 22px; background: rgba(14,18,16,0.78); border: 1px solid rgba(255,255,255,0.12); display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 12px; color: #6EE7B7; font-weight: 600">مساحة محفوظة</div>
      <div style="font-size: 16px; font-weight: 600">الصالون — سينما</div>
      <div style="font-size: 13px; color: #B8C4BE">شاشة فيديو كبيرة على الحائط</div>
    </div>
    <div style="flex: 1.2; padding: 16px 18px; border-radius: 22px; background: rgba(16,185,129,0.16); border: 1px solid rgba(52,211,153,0.4); display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 12px; color: #6EE7B7; font-weight: 600">اقتراح بصيرة</div>
      <div style="font-size: 15px; font-weight: 600; line-height: 1.5">وقفت عند الدقيقة ١٢ من حلقة MVVM. نكمّل؟</div>
      <button style="align-self: flex-start; margin-top: 2px; padding: 7px 14px; border-radius: 999px; border: 0; background: #10B981; color: #04120C; font-family: inherit; font-size: 13px; font-weight: 700">كمّل المشاهدة</button>
    </div>
  </div>

  <!-- dock -->
  <nav aria-label="الشريط السفلي" style="position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; padding: 10px 14px; border-radius: 28px; background: rgba(14,18,16,0.8); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(20px)">
    <button aria-label="الرئيسية" style="width: 52px; height: 52px; border-radius: 18px; border: 0; display: grid; place-items: center; background: #10B981"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#04120C" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
    <button aria-label="الميكروفون" style="width: 52px; height: 52px; border-radius: 18px; border: 0; display: grid; place-items: center; background: rgba(255,255,255,0.08)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F4F7F5" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button aria-label="وضع الرؤية" style="width: 52px; height: 52px; border-radius: 18px; border: 0; display: grid; place-items: center; background: rgba(255,255,255,0.08)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F4F7F5" stroke-width="2" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <a href="Main.dc.html" aria-label="النوافذ المفتوحة" style="width: 52px; height: 52px; border-radius: 18px; display: grid; place-items: center; background: rgba(255,255,255,0.08)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F4F7F5" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="13" height="10" rx="2"/><rect x="8" y="10" width="13" height="10" rx="2"/></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      apps: [
        { name: 'المتصفح', glyph: 'ب', bg: '#E8F0EC', fg: '#0F1412' },
        { name: 'يوتيوب', glyph: '▶', bg: '#EF4444', fg: '#FFFFFF' },
        { name: 'إنستغرام', glyph: 'إ', bg: '#DB2777', fg: '#FFFFFF' },
        { name: 'واتساب ويب', glyph: 'و', bg: '#16A34A', fg: '#FFFFFF' },
        { name: 'بصيرة AI', glyph: 'ب', bg: '#10B981', fg: '#04120C' },
        { name: 'ملاحظات', glyph: 'م', bg: '#FBBF24', fg: '#1C1405' },
        { name: 'GitHub', glyph: 'G', bg: '#1F2937', fg: '#FFFFFF' },
        { name: 'الخرائط', glyph: 'خ', bg: '#2563EB', fg: '#FFFFFF' },
        { name: 'موسيقى', glyph: '♪', bg: '#7C3AED', fg: '#FFFFFF' },
        { name: 'الملفات', glyph: 'ف', bg: '#0EA5E9', fg: '#04121A' },
        { name: 'الكاميرا', glyph: 'ك', bg: '#4B5563', fg: '#FFFFFF' },
        { name: 'الإعدادات', glyph: 'إ', bg: '#9CA3AF', fg: '#111827' }
      ]
    };
  }
}
</script>
</body>
</html>
